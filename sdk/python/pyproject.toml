[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openfda-vet"
version = "0.1.0"
description = "Python client for the openFDA Animal & Veterinary Adverse Events API."
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VetClaw / OpenVet Projects" }]
keywords = ["openfda", "veterinary", "fda", "adverse-events", "animal-health"]
dependencies = ["requests>=2.20"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/OpenVet-Projects/VetClaw"
"API Reference" = "https://open.fda.gov/apis/animalandveterinary/event/"

[tool.setuptools]
py-modules = ["openfda_vet"]
